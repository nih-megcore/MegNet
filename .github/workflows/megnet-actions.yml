name: megnet-tests
on: [push]
jobs:
  Pytest:
    name: InstallAndTest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.14"] #"3.10","3.11"]
        mne-version: ["1.12"] #0","1.11","1.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          auto-activate-base: false
          channels: conda-forge  
          channel-priority: strict
          python-version: ${{ matrix.python-version }}
      - name: Cache test conda environment
        id: cache-conda-test-env
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA }}/envs/test
          key: ${{ runner.os }}-conda-test-python-${{ matrix.python-version }}-mne-${{ matrix.mne-version }}-v1
      - name: Install MNE
        if: steps.cache-conda-test-env.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: $CONDA/bin/conda install --name test --strict-channel-priority --override-channels --channel=conda-forge 'python=${{ matrix.python-version }}' pytest 'mne=${{ matrix.mne-version }}'  
      - name: Install Git
        run: sudo apt install git -y
      - name: Make parent test data dir
        run: sudo mkdir -p /data/TEST_DATA
        shell: bash -el {0}
      - name: Cache MEGnet test data
        id: cache-megnet-test-data
        uses: actions/cache@v4
        with:
          path: megnet_test_data
          key: ${{ runner.os }}-megnet-test-data-v1
      - name: Download MEGnet Test Data
        if: steps.cache-megnet-test-data.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: nih-megcore/megnet_test_data
          token: ${{ secrets.MEGNET_TESTDATA }}
          path: megnet_test_data
      - name: Link test data into /data/TEST_DATA
        run: sudo ln -s ${GITHUB_WORKSPACE}/megnet_test_data /data/TEST_DATA/megnet_test_data
      - name: Pip Install Megnet
        shell: bash -el {0}
        run: $CONDA/envs/test/bin/pip install -e ${GITHUB_WORKSPACE}
      - name: Cache raw test data
        id: cache-raw-test-data
        uses: actions/cache@v4
        with:
          path: TEST_ctf_data
          key: ${{ runner.os }}-test-ctf-data-v1
      - name: Download raw test data
        if: steps.cache-raw-test-data.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: git clone https://github.com/nih-megcore/TEST_ctf_data.git ${GITHUB_WORKSPACE}/TEST_ctf_data
      - name: Link raw test data into /data/TEST_DATA
        run: sudo ln -sfn ${GITHUB_WORKSPACE}/TEST_ctf_data /data/TEST_DATA/TEST_ctf_data
      - name: Install extra packages for testing
        shell: bash -el {0}
        run: pip install pytest pygit2
      - name: Cache model weights
        id: cache-model-weights
        uses: actions/cache@v4
        with:
          path: MEGnet/model_v2k3
          key: ${{ runner.os }}-megnet-model-v2k3-v1
      - name: Initialize the model weights
        if: steps.cache-model-weights.outputs.cache-hit != 'true'
        shell: bash -el {0}
        run: $CONDA/envs/test/bin/megnet_init
      - name: Pytest
        shell: bash -el {0}
        run: $CONDA/envs/test/bin/pytest
  
